<section
  class="relative overflow-hidden border-t border-[#0f2f57] bg-[#031a3a] bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-size[40px_40px]"
>
  <div class="mx-auto max-w-5xl px-6 py-24 text-center lg:px-8">

    <!-- Heading -->
    <h2 class="text-4xl font-bold leading-tight text-white md:text-5xl">
      Ready to Transform Your
      <span class="text-[#fbbf24]">Banking Experience?</span>
    </h2>

    <!-- Subtext -->
    <p class="mx-auto mt-6 max-w-2xl text-lg text-[#c9d4e6]">
      Join thousands of users and organizations who have already said
      goodbye to waiting in line.
    </p>

    <!-- Buttons -->
    <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">

      <!-- Organisation -->
      <a
        [routerLink]="['/register']"
        [queryParams]="{ type: 'organisation' }"
        class="rounded-xl bg-[#2f66e8] px-8 py-4 text-lg font-semibold text-white shadow-md transition hover:bg-[#2556c5]"
      >
        Start as Organization
      </a>

      <!-- Customer -->
      <a
        [routerLink]="['/register']"
        [queryParams]="{ type: 'customer' }"
        class="rounded-xl bg-gray-200 px-8 py-4 text-lg font-semibold text-[#0b1730] transition hover:bg-gray-300"
      >
        Join as Customer
      </a>

    </div>

  </div>
</section>
