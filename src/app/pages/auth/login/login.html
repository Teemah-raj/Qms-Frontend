<mat-tab-group
  [(selectedIndex)]="selectedIndex"
  (selectedIndexChange)="mode = $event === 0 ? 'customer' : 'staff'"
>

  <!-- CUSTOMER LOGIN -->
  <mat-tab label="Customer">

    <div class="form-container">

      <form [formGroup]="customerLoginForm" (ngSubmit)="loginCustomer()">

        <mat-form-field appearance="outline">
          <mat-label>Email or Phone</mat-label>
          <input matInput formControlName="emailOrPhone">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="customerLoginForm.invalid"
        >
          Login
        </button>

      </form>

    </div>

  </mat-tab>

  <!-- STAFF LOGIN -->
  <mat-tab label="Staff">

    <div class="form-container">

      <form [formGroup]="staffLoginForm" (ngSubmit)="loginStaff()">

        <mat-form-field appearance="outline">
          <mat-label>Organisation</mat-label>
          <input matInput formControlName="organisation">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Branch</mat-label>
          <input matInput formControlName="branch">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Staff ID</mat-label>
          <input matInput formControlName="staffId">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="staffLoginForm.invalid"
        >
          Login to Dashboard
        </button>

      </form>

    </div>

  </mat-tab>

</mat-tab-group>
